name: Build site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build (static export)
        run: npm run build
      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-root
          path: out
          retention-days: 7
      - name: Deploy to GitHub Pages (trxunho.github.io)
        env:
          TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "PAGES_DEPLOY_TOKEN 未配置，跳过 GitHub Pages 部署（在仓库 Settings → Secrets 中添加该令牌后可自动上线）"
            exit 0
          fi
          cd out
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy from robotics-portfolio-public @ ${GITHUB_SHA}"
          git push -f "https://x-access-token:${TOKEN}@github.com/trxunho/trxunho.github.io.git" main
