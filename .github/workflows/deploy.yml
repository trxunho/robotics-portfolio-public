name: Build site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build (static export)
        run: npm run build
      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-root
          path: out
          retention-days: 7
      - name: Deploy to GitHub Pages (trxunho.github.io)
        # 仅当仓库配置了 PAGES_DEPLOY_TOKEN 时执行；缺省则跳过，不影响构建。
        if: ${{ secrets.PAGES_DEPLOY_TOKEN != '' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          external_repository: trxunho/trxunho.github.io
          publish_dir: ./out
          publish_branch: main
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
